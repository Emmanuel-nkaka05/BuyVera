{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-content padding-y bg">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-sm border-0 py-5">
                <div class="card-body">
                    <i class="fa fa-check-circle text-success" style="font-size: 80px;"></i>
                    <h2 class="mt-4 font-weight-bold">Thank You for Your Order!</h2>
                    <p class="lead text-muted">Your order has been placed successfully.</p>
                    <h5 class="mt-3">Order Number: <strong>{{ order.order_number }}</strong></h5>
                    <p class="text-muted mt-2">A confirmation email has been sent (simulated).</p>
                    <div class="mt-4">
                        <a href="{% url 'store' %}" class="btn btn-warning text-white px-4" style="background-color: #f9a826;">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</section>

{% endblock %}
