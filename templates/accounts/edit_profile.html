{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-content padding-y bg">
<div class="container">
    <div class="row">
        <!-- Sidebar (Same as Dashboard) -->
        <aside class="col-md-3">
            <ul class="list-group">
                <a class="list-group-item" href="{% url 'dashboard' %}"> My Dashboard </a>
                <a class="list-group-item" href="{% url 'my_orders' %}"> My Orders </a>
                <a class="list-group-item active" href="{% url 'edit_profile' %}"> Edit Profile </a>
                <a class="list-group-item" href="{% url 'logout' %}"> Logout </a>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="col-md-9">
            <div class="card border-0 shadow-sm rounded-lg">
                <div class="card-body p-4">
                    <h4 class="font-weight-bold mb-4">Edit Profile</h4>
                    
                    <!-- Display Messages -->
                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}

                    <form action="{% url 'edit_profile' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- User Info -->
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ request.user.first_name }}" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label>Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ request.user.last_name }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label>Phone Number</label>
                                <input type="text" name="phone_number" class="form-control" value="{{ request.user.phone_number }}" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label>Email Address</label>
                                <input type="email" class="form-control" value="{{ request.user.email }}" readonly>
                            </div>
                        </div>

                        <!-- Address Info -->
                        <div class="form-group">
                            <label>Address Line 1</label>
                            <input type="text" name="address_line_1" class="form-control" value="{{ userprofile.address_line_1 }}">
                        </div>
                        <div class="form-group">
                            <label>Address Line 2 (Optional)</label>
                            <input type="text" name="address_line_2" class="form-control" value="{{ userprofile.address_line_2 }}">
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label>City</label>
                                <input type="text" name="city" class="form-control" value="{{ userprofile.city }}">
                            </div>
                            <div class="form-group col-md-4">
                                <label>State</label>
                                <input type="text" name="state" class="form-control" value="{{ userprofile.state }}">
                            </div>
                            <div class="form-group col-md-4">
                                <label>Country</label>
                                <input type="text" name="country" class="form-control" value="{{ userprofile.country }}">
                            </div>
                        </div>

                        <!-- Profile Picture -->
                        <div class="form-group">
                            <label>Profile Picture</label><br>
                            {% if userprofile.profile_picture %}
                                <img src="{{ userprofile.profile_picture.url }}" class="img-thumbnail mb-2" style="max-width: 150px;">
                            {% endif %}
                            <input type="file" name="profile_picture" class="form-control-file">
                        </div>

                        <button type="submit" class="btn btn-gold mt-3">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</section>

{% endblock %}
