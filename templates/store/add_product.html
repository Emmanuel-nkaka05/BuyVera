{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-lg">
                <div class="card-body p-5">
                    <h3 class="font-weight-bold mb-4">Upload New Electronic Device</h3>
                    
                    <form action="{% url 'add_product' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="form-group">
                            <label class="font-weight-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <small class="text-danger">{{ field.errors|striptags }}</small>
                            {% endif %}
                        </div>
                        {% endfor %}
                        
                        <button type="submit" class="btn btn-gold btn-block mt-4">Upload Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
