{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-content padding-y bg">
<div class="container">
    <div class="row">
        <aside class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title mb-4">Billing Details</h4>
                    <form action="{% url 'place_order' %}" method="POST">
                        {% csrf_token %}
                        <div class="form-row">
                            <div class="col form-group">
                                <label>First Name</label>
                                <input type="text" name="first_name" class="form-control" required>
                            </div>
                            <div class="col form-group">
                                <label>Last Name</label>
                                <input type="text" name="last_name" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label>Phone Number</label>
                                <input type="text" name="phone" class="form-control" required>
                            </div>
                            <div class="col form-group">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Address Line 1</label>
                            <input type="text" name="address_line_1" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Address Line 2 (Optional)</label>
                            <input type="text" name="address_line_2" class="form-control">
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label>City</label>
                                <input type="text" name="city" class="form-control" required>
                            </div>
                            <div class="col form-group">
                                <label>State</label>
                                <input type="text" name="state" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label>Country</label>
                                <input type="text" name="country" class="form-control" required>
                            </div>
                            <div class="col form-group">
                                <label>Order Note</label>
                                <input type="text" name="order_note" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning btn-block text-white" style="background-color: #f9a826;">Place Order</button>
                    </form>
                </div>
            </div>
        </aside>

        <aside class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title mb-4">Your Order</h4>
                    <table class="table table-borderless table-shopping-cart">
                        <thead class="text-muted">
                            <tr class="small text-uppercase">
                                <th scope="col">Product</th>
                                <th scope="col" width="120">Quantity</th>
                                <th scope="col" width="120">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cart_item in cart_items %}
                            <tr>
                                <td>
                                    <figure class="itemside align-items-center">
                                        <div class="aside"><img src="{{ cart_item.product.images.url }}" class="img-sm"></div>
                                        <figcaption class="info">
                                            <a href="#" class="title text-dark">{{ cart_item.product.product_name }}</a>
                                        </figcaption>
                                    </figure>
                                </td>
                                <td> 
                                    <label>{{ cart_item.quantity }}</label>
                                </td>
                                <td> 
                                    <div class="price-wrap"> 
                                        <var class="price">K {{ cart_item.sub_total }}</var> 
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    
                    <dl class="dlist-align">
                        <dt>Total price:</dt>
                        <dd class="text-right">K {{ total }}</dd>
                    </dl>
                    <dl class="dlist-align">
                        <dt>Tax:</dt>
                        <dd class="text-right">K {{ tax }}</dd>
                    </dl>
                    <dl class="dlist-align">
                        <dt>Total:</dt>
                        <dd class="text-right text-dark b"><strong>K {{ grand_total }}</strong></dd>
                    </dl>
                </div>
            </div>
        </aside>
    </div>
</div>
</section>

{% endblock %}
