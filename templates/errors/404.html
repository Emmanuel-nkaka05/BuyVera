{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 py-5">
            <h1 class="display-1 font-weight-bold" style="color: var(--brand-gold); font-size: 120px;">404</h1>
            <h2 class="font-weight-bold mb-3">Oops! Page not found.</h2>
            <p class="text-muted lead mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="{% url 'home' %}" class="btn btn-gold btn-lg"><i class="fa fa-home mr-2"></i> Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
